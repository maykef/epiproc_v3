# Department name normalisation rules.
# Each entry has a canonical 'name' and a list of lowercase 'patterns'.
# _dept_from_combo() returns the name of the first entry whose patterns list
# contains a substring present in the lowercased address/name combo.
# Ordering matters — earlier entries take priority.
#
# Special cases handled in Python (not expressible as simple substrings):
#   - CIMR compound match: "cmr" AND ("hills rd" OR "hills road")
#   - Shared Services skip: norm_dept() skips "Shared Services" from the
#     buyer combo and falls back to ship_to before accepting it.

