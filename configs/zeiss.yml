supplier: zeiss
dedup_key: invoice_number

dashboard:
  display_name: "Carl Zeiss Ltd"
  color: "#06B6D4"
  payer_fallback_keywords:
    - "Central Finance"
    - "Accounts Payable"
    - "Finance Department"
    - "Billing Department"
  negative_document_types:
    - "Credit Note"
    - "Cancellation Invoice"
  document_types:
    - "invoice"
    - "credit note"
    - "cancellation invoice"
    - "down payment invoice"
    - "proforma"

input_dir: invoices/zeiss
output_dir: databases
db_filename: invoices_zeiss.db

pdf_dpi: 100
max_tokens: 8192

ocr_fallback:
  enabled: true
  engine: pytesseract
  languages: eng
  trigger_condition: "text_layer_empty"

date_normalization:
  enabled: true
  input_formats:
    - "DD.MM.YYYY"
    - "DD-MM-YYYY"
    - "DD/MM/YYYY"
  output_format: "YYYY-MM-DD"
  force_conversion: true

post_processing:
  credit_note_sign_correction:
    enabled: true
    trigger:
      - "document_type == 'Credit Note'"
      - "document_type == 'Cancellation Invoice'"
    action:
      - "negate: totals.total"
      - "negate: totals.vat_amount"
      - "negate: totals.subtotal"
      - "negate: line_items[*].total_price"
      - "ensure_positive: totals.discount_amount"

  g3_scaling_correction:
    enabled: true
    trigger:
      - "subscription_period.start is not null AND subscription_period.end is not null"
      - "line_items[*].description contains 'Protect' OR 'Maintenance' OR 'Service Contract'"
    action:
      - "update: totals.subtotal = items_net"
      - "update: line_items[*].total_price = line_items[*].unit_price * line_items[*].quantity"

  g1_residual_correction:
    enabled: true
    trigger:
      - "line_items[*].total_price is null"
      - "line_items.length > 1"
      - "totals.subtotal is not null"
      - "line_items[*].description contains 'Maintenance' OR 'Residual' OR 'Planned Maintenance' OR 'SMA'"
    action:
      - "create_synthetic_item: description='Contract Total', quantity=1, unit='1', total_price=totals.subtotal"
      - "remove: line_items where total_price is null"
      - "update: totals.subtotal = items_net"

  subtotal_scope_correction:
    enabled: true
    trigger:
      - "line_items[*].description contains 'Service' OR 'Labour' OR 'Travel'"
      - "totals.subtotal != items_net"
    action:
      - "update: totals.subtotal = items_net"

  g4_g8_correction:
    enabled: true
    trigger:
      - "correction_log contains 'G4' AND correction_log contains 'G8'"
    action:
      - "update: items_net = totals.subtotal"

  kmat_discount_extraction:
    enabled: true
    trigger:
      - "line_items[*].description contains 'KMAT' OR 'Bundle'"
    action:
      - "aggregate: totals.discount_amount = sum(all_discount_rows)"

  single_item_fallback:
    enabled: true
    trigger:
      - "line_items.length == 1"
      - "line_items[0].total_price is null"
      - "totals.subtotal is not null"
    action:
      - "update: line_items[0].total_price = totals.subtotal"
      - "update: line_items[0].unit_price = totals.subtotal / line_items[0].quantity"

  extraction_failure_flag:
    enabled: true
    trigger:
      - "notes contains 'No valid PDF pages found'"
      - "notes contains 'embedded attachment'"
      - "notes contains 'annotation stream'"
    action:
      - "flag: requires_manual_review"

  discount_validation:
    enabled: true
    trigger:
      - "totals.discount_amount is not null"
      - "totals.subtotal is not null"
    action:
      - "validate: if totals.discount_amount > totals.subtotal then set totals.discount_amount = null"
      - "validate: if totals.discount_amount matches regex '^[A-Z]{1,3}[0-9]+$' then set totals.discount_amount = null"

  arithmetic_check_exemption:
    enabled: true
    trigger:
      - "line_items[*].description contains 'Protect' OR 'Maintenance' OR 'Service Contract' OR 'Training' OR 'Installation'"
      - "document_type == 'Credit Note'"
    action:
      - "skip: check_item_arithmetic"

extraction_prompt: |
  You are an invoice extraction AI.
  You are processing Page 1 of a document from "Carl Zeiss Ltd".
  Extract all fields into the JSON schema provided below.
  
  CRITICAL RULES:
  1. Return ONLY valid JSON. No markdown, no explanation.
  2. Use JSON null for any field not present on the page.
  3. All dates must be converted to YYYY-MM-DD format.
  4. All monetary values must be plain numbers (no currency symbols, no commas).
  5. discount_amount must always be a positive number.
  6. subtotal = sum of ALL line item total_prices across ALL pages BEFORE discounts.
     Since this is Page 1, calculate the subtotal based ONLY on the line items visible on this page.
  7. total = grand total from the summary section on this page (if present).
  8. Document Types & Sign Convention:
     - Identify if this is "invoice", "credit note", "cancellation invoice", "proforma", or "down payment invoice".
     - If the header explicitly says "Down Payment Invoice", set document_type to "down payment invoice".
     - "Credit Note" or "Cancellation Invoice" implies negative amounts for totals.
     - CRITICAL: If document_type is "Credit Note" or "Cancellation Invoice", store `total`, `vat_amount`, AND `subtotal` as NEGATIVE numbers.
     - CRITICAL: If document_type is "invoice" (or "proforma", "down payment invoice"), ALL line item `total_price` values MUST be POSITIVE numbers, even if the document contains text like "Credit" in a section header or "Returns" in a description. Only negate if the document_type itself is negative.
     - Invoice numbers may start with 'Z' (Credit Note) or 'F' (Invoice, Cancellation, or Down Payment). Check the document title, not just the prefix.
  9. Address Blocks: Look for three columns: Payer (Buyer), Ship-to, Sold-to.
     - Map "Payer" to buyer.
     - Map "Ship-to" to ship_to.
     - Map "Sold-to" to sold_to.
     - If the Payer block contains multiple lines (e.g., "MRC Unit / University of Cambridge"), 
       put the specific unit in 'name' and the parent institution in 'department' ONLY if the hierarchy is clear.
       Otherwise, put the full text in 'name' and leave 'department' null.
  10. References: Look for "Your Order", "Order Confirmation", "Customer Number", "Document Number",
      "Original Invoice Number" (for cancellation invoices), "Delivery", "External Delivery Number", "Tax Number".
      - Map "Document Number" to your_reference.
      - Map "Original Invoice Number" to your_reference (overrides Document Number if both present).
      - Map "Your Order" to order_reference (This is the buyer's PO number).
      - Map "Order Confirmation" to order_confirmation.
      - Map "Delivery" and "External Delivery Number" to order_reference.
      - Map "Customer Number" to buyer.customer_number.
      - Map "Tax Number" to notes (do NOT map to buyer.customer_number).
      - Note: The schema includes 'sales_person' and 'coordinator', but these labels are rarely seen. Only extract if explicitly labeled.
      - If an order date is found near "Your Order" or "Order Confirmation", map it to order_date.
  11. Discounts: Look for "Order discount", "Account discount", "UCAM discount".
      - Extract percentage and amount.
      - CRITICAL: Discount percentages are often printed with a negative sign (e.g., "-17.50%"). 
        You MUST strip the negative sign and store the value as a positive number (e.g., 17.5).
      - CRITICAL: ONLY populate `discount_rate_percent` and `discount_amount` from the GLOBAL SUMMARY section (Totals block).
        DO NOT extract `discount_rate_percent` from individual line-item labels (e.g., "-100%" on a specific item).
        If a line item shows a discount, it is already reflected in the line item's `total_price`. Do not double-count.
      - Note: Discounts may appear as text notes above the table or in the totals section.
      - If a line item is labeled "Disc.agreed Net pr." with a negative amount, treat it as a line-item discount (already in total_price).
      - Map "Discount Agreed Price" (if seen in totals) to discount_2.
      - VALIDATION: If the extracted discount_amount is larger than the subtotal, or looks like a reference number (e.g., contains letters), set discount_amount to null.
  12. Subscription Period:
     - PREFERRED: Look for an explicit "Billing Period:" field on any line item (e.g., "Billing Period: 01.06.2025 to 31.05.2026"). Extract start from the date BEFORE "to" and end from the date AFTER "to". The DATES in the "Billing Period" line are authoritative.
     - FALLBACK (service contracts only): If NO "Billing Period:" is found anywhere on the invoice, AND the invoice contains service contract items (descriptions containing "Protect", "Maintenance", "Service Contract", or "LabScape"), then:
       * Set subscription_period.start = the "Date of Delivery or Performance" date.
       * Derive subscription_period.end by adding the quantity unit duration to the start date (e.g., "12 MON" → start + 12 months; "6 MON" → start + 6 months).
     - CRITICAL: Do NOT use this fallback for goods-only invoices (equipment, spare parts). Only apply when service contract line items are present.
      - CRITICAL: If the invoice is for a partial period of a multi-year contract (e.g., "12 MON" billed out of a 5-year term),
        the `subtotal` and `total` should reflect the AMOUNT BILLED on this invoice, NOT the full contract value.
        Use the "Total (excl. VAT)" or "Total" from the summary section as the source of truth for the billed amount.
        Do not sum line items if they represent the full contract value but the summary shows a partial billing amount.
  13. Bank Details: Look for "Bank Name", "Sort Code", "Account Number", "IBAN", "SWIFT".
      - Note: Bank details may be split by currency (GBP/Euro) at the bottom.
      - If multiple accounts exist (e.g., GBP and Euro), prioritize the primary currency or the first one found.
  14. Export Control & Serial Numbers: 
      - Ignore export control text for structured extraction, but note if present in "notes".
      - CRITICAL: Look for "Serial Numbers" or "Package Details" (dimensions, weight). 
      - If serial numbers or package details are found, include them in the "notes" field with a clear label (e.g., "Serial Numbers: [list]; Package Details: [details]").
      - If the document contains embedded attachments or annotations (indicated by text like "exported pages attached"), add "embedded attachment detected" to notes.
  15. Line Items: Extract position, article, quantity, unit, description, unit_price, total_price.
      - Handle "12 MON" as quantity/unit if applicable.
      - Handle negative amounts for discounts if they appear as line items (e.g., "Disc.agreed Net pr.").
      - CRITICAL: If a line item description is split across pages, do not guess the missing part. 
        If the description is incomplete on this page, leave it as found or null if it clearly belongs to the next page.
        Do not copy descriptions from subsequent items to fill gaps.
      - FIX C3/C4: When extracting line items, ensure you capture the `total_price` from the right-most column even if it differs from `quantity * unit_price`.
        Always prioritize the explicit `total_price` column value over any calculated result.
      - FIX C3: If the document is a Credit Note (Z-prefix or "Credit Note" label), ensure all line item `total_price` values are NEGATIVE numbers.
      - FIX C3: For the `totals` section, identify the "Total (excl. VAT)" or "Total" line that represents the final sum before VAT.
        Do not use intermediate subtotals (e.g., "Subtotal" for goods only) if service items are listed below it.
        The `subtotal` field in the JSON must represent the sum of ALL line items (goods + services) before discounts.
        If the document is a Credit Note, ensure `subtotal` is NEGATIVE.
      - FIX C3-D: If prices are missing in the main column, look for right-aligned columns or separate price blocks.
        If a line item spans multiple rows, ensure the price is captured for the correct item.
      - FIX C4 (Service Contracts): For lines containing "Protect", "Maintenance", or "Service Contract":
        - Interpret `quantity` as the number of instruments/systems (usually 1).
        - Interpret `unit` as the time period (e.g., "12 MON" or "6 MON").
        - Use the value shown in the `total_price` column directly.
        - If `unit_price` is shown as a monthly rate and unit is "12 MON", set `unit_price` = monthly_rate × 12.
        - CRITICAL: Ensure `total_price` is consistent with `unit_price * quantity` for service contracts to avoid arithmetic errors.
      - FIX C7 (Multi-page/SMA): If this is Page 1 and line items are incomplete, extract only what is visible. 
        If "SMA Fee" or similar service fees appear, extract them as line items with appropriate unit (e.g., "12 MON").
        Do not leave unit_price or total_price as null if a value is visible in a right-aligned column.
      - FIX: Single Item Fallback. If only one line item exists and its price is null, set total_price = subtotal.
      - FIX: Multi-Item Null Prices (SMA/Planned Maintenance). If multiple line items exist (e.g., 20 items) and ALL have null prices, but a valid `totals.subtotal` exists, do not distribute the subtotal. Instead, prepare the data so the post-processor can create a single "Contract Total" item.

  JSON SCHEMA:
  {
    "document_type": null,
    "invoice_number": null,
    "invoice_date": null,
    "currency": null,
    "seller": {
      "name": null,
      "address": null,
      "vat_number": null,
      "registration_number": null,
      "phone": null,
      "website": null
    },
    "buyer": {
      "name": null,
      "department": null,
      "address": null,
      "customer_number": null
    },
    "ship_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "sold_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "references": {
      "your_reference": null,
      "order_reference": null,
      "order_date": null,
      "order_confirmation": null,
      "sales_person": null,
      "coordinator": null
    },
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

continuation_prompt: |
  You are an invoice extraction AI processing Page 2+ of a multi-page invoice from "Carl Zeiss Ltd".

  LAYOUT RULES (continuation page):
  - Multi-page Zeiss invoices repeat the header on each page (Carl Zeiss Ltd, "Document Number", "Date", "Page N of M").
  - The line-items table continues with the SAME column headers as page 1:
      Item | Product ID / Product Description | Quantity | Unit Price (GBP) | Total Price (GBP)
  - The TOTALS summary block appears at the END of the invoice (usually the last page). The EXACT row labels Zeiss prints are:
      "Sub Total"                            → totals.subtotal   (sum of ALL line items across ALL pages, BEFORE discounts)
      "Order discount"                       → totals.discount_amount (often shown as e.g. "-30.00 % of 710,962.00  -213,288.60 GBP")
      "Account discount"  or  "UCAM discount" → totals.discount_amount (same field, whichever label is present)
      "Discount Agreed Price"                → totals.discount_2  (positive number; the printed value is negative, store its absolute value)
      "Total (excl. VAT)"                    → INTERMEDIATE figure (Sub Total - discounts). Do NOT map this to subtotal or total.
      "VAT ( A )"  or  "VAT 20%"  or  "VAT"  → totals.vat_amount
      "Total"                                → totals.total
  - Some credit notes / small invoices omit "Sub Total" and start with "Total (excl. VAT)" — in that case leave subtotal null on this page (page 1 may have it) and only fill total_amount + vat_amount.
  - Intermediate continuation pages (not the last page) contain ONLY line items, no totals block.
  - SoftCo wrapper PDFs sometimes embed the Zeiss invoice; if a page is a SoftCo cover sheet, treat it as having no line items and no totals.
  - Invoice numbers may start with 'Z' (Credit Note) or 'F' (Invoice, Cancellation, or Down Payment).

  EXTRACTION INSTRUCTIONS (continuation page):
  1. Line Items:
     - APPEND every line item row visible on this page to line_items[].
     - Use the printed "Item" number (e.g. 20, 30, 1070, 1170) as `position` — DO NOT renumber from 1.
     - Capture `article` = Product ID (e.g. "493258-9880-010"), `description` = the text below it (multi-line OK), `quantity`, `unit` (e.g. "PC", "MON"), `unit_price`, `total_price`.
     - Rows with only "Item includes Subitems 000020 to 000940" or only Commodity/Export Control metadata are NOT line items — skip them.
     - If a line item has no price columns filled (e.g. it's a sub-item of a KMAT bundle), still record it with unit_price=null, total_price=null.
     - DO NOT invent positions, articles, or prices. DO NOT copy descriptions from other rows.
  2. Totals:
     - Look for the literal label "Sub Total" or "Total (excl. VAT)" or "Total" lines on THIS page.
     - If this page contains the summary block:
         * Set totals.subtotal from the "Sub Total" row (this is the gross sum across ALL pages, NOT just this page's items).
         * Set totals.discount_amount from "Order discount" / "Account discount" / "UCAM discount" amount (store as POSITIVE).
         * Set totals.discount_2 from "Discount Agreed Price" amount (store as POSITIVE).
         * Set totals.vat_amount from the "VAT" row.
         * Set totals.total from the "Total" row (the FINAL line, AFTER VAT — NOT the "Total (excl. VAT)" line).
         * Set totals.vat_rate_percent if the VAT row shows a percent (e.g. "20.00 %" → 20.0; "0 %" → 0.0).
         * Arithmetic sanity check (within £0.50): subtotal - discount_amount - discount_2 + vat_amount ≈ total.
     - CRITICAL: Use ONLY the JSON keys defined in the schema (subtotal, discount_amount, discount_2, vat_amount, vat_rate_percent, total). DO NOT invent extra keys like "total_amount" or "net_total".
     - If this page contains NO totals block (line items only):
         * Return ALL totals fields as null. The merge step preserves non-null values from the final page; null values here will NOT overwrite anything.
         * DO NOT compute subtotal from this page's line items only — that would be wrong.
  3. Sign convention (carry over from page 1):
     - "Credit Note" or "Cancellation Invoice" → totals.subtotal, totals.vat_amount, totals.total NEGATIVE; line_items[*].total_price NEGATIVE.
     - "Invoice" / "proforma" / "down payment invoice" → all positive.
     - Detect from the page header if visible; otherwise default to positive (page-1 metadata wins on merge).
  4. discount_amount and discount_2 are ALWAYS stored as POSITIVE numbers even though the printed values have a minus sign.
  5. All dates → YYYY-MM-DD. All monetary values → plain numbers (no commas, no currency symbol).
  6. If you cannot find a value, return JSON null. DO NOT guess.

  OUTPUT: Return ONLY valid JSON matching the same schema as page 1 (document_type, invoice_number, invoice_date, currency, seller, buyer, ship_to, sold_to, references, line_items, totals, payment_terms, subscription_period, bank_details, notes). No markdown, no explanation.
