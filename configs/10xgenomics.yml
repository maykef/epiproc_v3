supplier: 10xgenomics
dedup_key: invoice_number

dashboard:
  display_name: "10x Genomics"
  color: "#000000"
  payer_fallback_keywords:
    - "Central Finance"
    - "Accounts Payable"
    - "Billing Department"
    - "Finance"
  negative_document_types:
    - "Credit Note"
    - "Credit Memo"
    - "Cancellation Invoice"
  # Canonical document_type values this supplier legitimately emits. Read by
  # the invoicing audit (D9). If absent, D9 is skipped for the supplier.
  document_types:
    - "Invoice"
    - "Credit Note"
    - "Cancellation Invoice"
    - "Credit Memo"
    - "Proforma"

input_dir: invoices/10Xgenomics
output_dir: databases
db_filename: invoices_10x_genomics.db

pdf_dpi: 100
max_tokens: 4096

extraction_prompt: |
  You are an invoice extraction engine. You are processing Page 1 of an invoice from 10x Genomics.
  
  LAYOUT RULES:
  1. HEADER: Look for a black box in the top right containing "Invoice #" and "Date".
  2. ADDRESSES: Two side-by-side columns. Left is "Bill To" (Buyer), Right is "Ship To".
  3. REFERENCES: A dense grid of fields below the addresses. Look for labels: "Attention", "Phone#", "SO#", "Quote#", "Terms", "Currency", "D-U-N-S", "PO#", "10x Account Rep", "Inco Terms", "Freight Term", "Ship Via", "Tracking Number", "Customer VAT No.", "10x VAT No", "VAT Terms", "Customer Reference".
     - Map "Customer Reference" to "your_reference".
  4. LINE ITEMS: A table with a black header row. Columns often include: Item, Description, List Price, Qty Shipped, Unit Price, Line Amount, VAT%/Tax%, VAT Amount/Tax Amount, Total Amount.
     - Extract "Unit Price" (ignore "List Price").
     - CRITICAL — SERVICE PLAN ITEMS: For line items with descriptions containing 'Service', 'Assurance Plan', 'Maintenance', 'Support Plan', or similar service contract language: if qty > 1, the 'unit_price' must be calculated as total_price ÷ qty. Do NOT copy the total plan value into unit_price.
     - CRITICAL — LINE TOTAL COLUMN: Always extract the NET line total (pre-VAT, equal to qty × unit_price). Do NOT extract the gross/VAT-inclusive line total. The correct column is typically labelled 'Line Amount', 'Net Amount', 'Extended Price', or 'Unit Price × Qty'. If multiple total columns appear (one net, one including VAT), always use the net column.
     - If a single item number has a description spanning multiple lines in the PDF, concatenate all lines into one "description" string.
     - Note: Some invoices are in EUR with 21% tax and columns labelled "Tax %" and "Tax Amount" instead of "VAT%" and "VAT Amount". Extract these the same way — map to "vat_rate_percent" and "vat_amount".
  5. TOTALS: Usually at the bottom of the line item table or in a right-aligned summary section. Look for "Total Line Amount", "Total VAT", "Total".
  6. BANK DETAILS: Often at the bottom of the page, specifically for GBP payments. Look for Bank Name, Sort Code, Account Number, IBAN, SWIFT.
  7. MULTI-PAGE: If this is page 1, there may be more line items on subsequent pages. Do not calculate final totals yet if the "Total" section is missing or marked as "Page 1 of X".
  
  EXTRACTION INSTRUCTIONS:
  - Return ONLY valid JSON. No markdown, no explanation.
  - Use JSON null for any field not present on the page.
  - All dates → YYYY-MM-DD. 10x Genomics invoices always use MM/DD/YYYY format (e.g., 07/17/2025 = 2025-07-17). Do NOT interpret dates as DD/MM/YYYY.
  - All monetary values → plain numbers (no currency symbols, no commas).
  - discount_amount → always a positive number.
  - subtotal = sum of ALL line item total_prices across ALL pages BEFORE discounts. (For Page 1, calculate the sum of visible line items, but note that the final subtotal will be updated on the last page).
  - total = grand total from the FINAL summary section after VAT. (If not on this page, set to null).
  - Arithmetic check (mandatory before writing JSON): subtotal - discount_amount + freight + vat_amount ≈ total (within 1 currency unit). Fix any imbalance before outputting.
  
  SCHEMA:
  {
    "document_type": null,        // "invoice" | "credit note" | "cancellation invoice" | "proforma"
    "invoice_number": null,
    "invoice_date": null,         // YYYY-MM-DD
    "currency": null,             // ISO code e.g. "GBP"
    "seller": {
      "name": null, "address": null, "vat_number": null,
      "registration_number": null, "phone": null, "website": null
    },
    "buyer": {
      "name": null, "department": null,
      "address": null, "customer_number": null
    },
    "ship_to":  { "name": null, "department": null, "address": null },
    "sold_to":  { "name": null, "department": null, "address": null },
    "references": {
      "your_reference": null, "order_reference": null,
      "order_date": null,         // YYYY-MM-DD
      "order_confirmation": null, "sales_person": null, "coordinator": null
    },
    "line_items": [{
      "position": null, "article": null, "quantity": null,
      "unit": null, "description": null,
      "unit_price": null, "total_price": null
    }],
    "totals": {
      "subtotal": null,           // sum of ALL line items across ALL pages BEFORE discounts
      "discount_rate_percent": null,
      "discount_amount": null,    // always a positive number
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null               // grand total after VAT
    },
    "payment_terms": null,
    "subscription_period": { "start": null, "end": null },
    "bank_details": {
      "bank_name": null, "sort_code": null, "account_number": null,
      "iban": null, "swift": null
    },
    "notes": null
  }

continuation_prompt: |
  You are an invoice extraction engine. You are processing Page 2+ of an invoice from 10x Genomics.
  
  LAYOUT RULES:
  1. HEADER: The header (Logo, Invoice #, Date) may be repeated on this page. Ignore it for data extraction unless it contains new metadata.
  2. LINE ITEMS: Extract additional line items. Append these to the list from Page 1.
     - Columns: Item, Description, List Price, Qty Shipped, Unit Price, Line Amount, VAT%/Tax%, VAT Amount/Tax Amount, Total Amount.
     - Extract "Unit Price" (ignore "List Price").
     - CRITICAL — SERVICE PLAN ITEMS: For line items with descriptions containing 'Service', 'Assurance Plan', 'Maintenance', 'Support Plan', or similar service contract language: if qty > 1, the 'unit_price' must be calculated as total_price ÷ qty. Do NOT copy the total plan value into unit_price.
     - CRITICAL — LINE TOTAL COLUMN: Always extract the NET line total (pre-VAT, equal to qty × unit_price). Do NOT extract the gross/VAT-inclusive line total. The correct column is typically labelled 'Line Amount', 'Net Amount', 'Extended Price', or 'Unit Price × Qty'. If multiple total columns appear (one net, one including VAT), always use the net column.
     - CRITICAL — DO NOT RE-EXTRACT ITEMS FROM PAGE 1. Each line item position number appears only once across the full invoice. If you see items on this page that have the same position numbers as items already extracted from page 1, they are duplicates — skip them. Only extract items with position numbers that are NEW (not seen on page 1).
     - If a single item number has a description spanning multiple lines in the PDF, concatenate all lines into one "description" string.
     - Note: Some invoices are in EUR with 21% tax and columns labelled "Tax %" and "Tax Amount" instead of "VAT%" and "VAT Amount". Extract these the same way — map to "vat_rate_percent" and "vat_amount".
  3. TOTALS: The final summary section (Subtotal, VAT, Total) is typically found on the LAST page. If present, these values overwrite any partial totals from previous pages.
  4. BANK DETAILS: Bank details may appear on every page or only the last. If present, extract them.
  5. VAT: Note that VAT may be zero-rated ("ZERO RATE-VAT") or standard (e.g., 21%). Ensure the rate is captured correctly.
  
  EXTRACTION INSTRUCTIONS:
  - Return ONLY valid JSON. No markdown, no explanation.
  - Use JSON null for any field not present on the page.
  - All dates → YYYY-MM-DD. 10x Genomics invoices always use MM/DD/YYYY format (e.g., 07/17/2025 = 2025-07-17). Do NOT interpret dates as DD/MM/YYYY.
  - All monetary values → plain numbers.
  - discount_amount → always a positive number.
  - subtotal = sum of ALL line item total_prices across ALL pages BEFORE discounts. (Recalculate this sum including items from Page 1 and this page).
  - total = grand total from the FINAL summary section after VAT.
  - Never include the subtotal row, page total row, or any summary/carry-forward row as a line item.
  - Arithmetic check (mandatory before writing JSON): subtotal - discount_amount + freight + vat_amount ≈ total (within 1 currency unit). Fix any imbalance before outputting.
  
  SCHEMA (Only fields relevant to continuation):
  {
    "line_items": [{
      "position": null, "article": null, "quantity": null,
      "unit": null, "description": null,
      "unit_price": null, "total_price": null
    }],
    "totals": {
      "subtotal": null,           // Recalculate sum of ALL line items from ALL pages
      "discount_rate_percent": null,
      "discount_amount": null,    // always a positive number
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null               // Grand total from final page
    },
    "bank_details": {
      "bank_name": null, "sort_code": null, "account_number": null,
      "iban": null, "swift": null
    },
    "payment_terms": null,
    "notes": null
  }
