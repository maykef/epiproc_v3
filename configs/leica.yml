      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "payment_terms": null,
    "subscription_period": { "start": null, "end": null },
    "seller": { "name": null, "address": null, "vat_number": null, "registration_number": null, "phone": null, "website": null },
    "buyer": { "name": null, "department": null, "address": null, "customer_number": null },
    "ship_to": { "name": null, "department": null, "address": null },
