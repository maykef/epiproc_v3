      "iban": null,
      "swift": null
    },
    "notes": null
  }

continuation_prompt: |
  You are processing Page N (N > 1) of an invoice from Evident Europe GmbH.
  Extract additional line items and final totals.

  SUPPLIER SPECIFIC RULES:
  - Line Items: Append to the list from previous pages.
    * Standard Layout: Use 'Del. qty' for quantity if available, otherwise 'Order qty'.
    * Special Layout (88-prefix): Map 'Pos', 'Information/Article/Expenditure', 'Qty', 'U/M', 'Line amount' as described in extraction_prompt.
    * Simple Service Layout: Handle missing quantity/unit columns as described in extraction_prompt.
    * CRITICAL: The 'total_price' field MUST be the NET amount (the value in the "Line amount" column).
    * DO NOT calculate total_price as unit_price * quantity if a "Line amount" column exists. Always prefer the explicit "Line amount" value.
    * If a line item shows a gross amount and a separate negative discount amount, the "Line amount" column usually already reflects the net. If the "Line amount" is missing, calculate: (unit_price * quantity) + discount_amount.
    * Note: Serial numbers may be embedded in descriptions.
    * Note: Export Control Classification and Country of Origin may be in descriptions.
    * CRITICAL: Do NOT extract metadata rows (e.g., "Model: ...", "Charge-/Serialno.: ...") as line items. Only extract rows that have a valid Position number and a monetary amount.
  - Totals:
    * subtotal = sum of ALL line item NET total_prices across ALL pages.
    * total = grand total from the FINAL summary section after VAT.
    * Look for "Net value", "Output Tax", "VAT", "TOTAL".
    * VAT rates may be 0.00% for certain items.
  - Payment Terms: Look for "Due within 30 days", "DAP Cambridge".
  - Notes: Look for "Export Control Classification", "Russia embargo warning", "EAR99 goods disclaimer".
  - Bank Details: Look for bank name, sort code, account number, IBAN, SWIFT.

  ARITHMETIC CHECK (MANDATORY):
  1. Recalculate subtotal as the sum of all line items (including those from previous pages) using their NET 'total_price'.
  2. Verify: subtotal - discount_amount + freight + vat_amount ≈ total.
  3. If imbalance exists, adjust 'vat_amount' or 'discount_amount' to match the printed 'total', ensuring 'subtotal' remains the sum of net line items.
  4. If a discount is found that contradicts the line item totals (e.g., line items are already net, but a large discount is listed separately), set 'discount_amount' to null to avoid double-counting.

  OUTPUT FORMAT:
  Return ONLY valid JSON. No markdown, no explanation.
  Use JSON null for any field not present on the page.

  JSON TEMPLATE (CONTINUATION):
  {
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

