supplier: oxford_nanopore
dedup_key: invoice_number

dashboard:
  display_name: "Oxford Nanopore Technologies"
  color: "#00A3E0"
  payer_fallback_keywords:
  - "Finance"
  - "Accounts"
  - "Billing"
  - "Central"
  negative_document_types:
  - "Credit note"
  # Canonical document_type values this supplier legitimately emits. Read by
  # the invoicing audit (D9). If absent, D9 is skipped for the supplier.
  document_types:
  - "Invoice"
  - "Credit note"

input_dir: invoices/oxford_nanopore
output_dir: databases
db_filename: invoices_oxford_nanopore.db

pdf_dpi: 100
max_tokens: 4096

# C4 Fix: Allow significant deviation between unit_price * quantity and total_price
# due to negotiated customer discounts applied at line level.
validation:
  line_item_arithmetic_tolerance: 0.50

extraction_prompt: |
  You are an expert invoice extraction AI. You are processing Page 1 of an invoice from Oxford Nanopore Technologies.

  INSTRUCTIONS:
  1. Extract all fields according to the JSON schema below.
  2.

    SUBSCRIPTION / SERVICE PERIOD (Oxford Nanopore — derive from item description):
    ONT invoices do NOT print explicit "from … to …" dates for service contracts. Instead the duration is embedded in the line-item description, e.g.:
      "GridION Standard Support (3 year)"     -> 3 years
      "PromethION Standard Support (1 year)"  -> 1 year
      "MinION Mk1C Standard Support (1 year)" -> 1 year
      "LICENSE AND WARRANTY 60 MONTHS - MK1B" -> 60 months
      "LICENSE AND WARRANTY 12 MONTHS"        -> 12 months
      "Annual subscription"                    -> 12 months
    When a line item description matches one of these patterns:
      - Set `subscription_period.start` = the invoice_date (YYYY-MM-DD).
      - Set `subscription_period.end`   = invoice_date plus the duration parsed from the description (round the day to the same day of month; if duration is in years multiply by 12 months).
    If multiple line items have different durations, use the LONGEST one.
    If no line item matches a duration pattern (typical for consumables-only orders), leave both fields null. Do not invent a period.
    Article codes that signal a support/warranty/subscription line: any code starting with "STANDARD", "PREMIUM", "SLW", or any description containing "Support", "WARRANTY", "License", "Subscription", "Maintenance".

  Return ONLY valid JSON. No markdown, no explanation.
  3. Use JSON null for any field not present on this page.
  4. Dates must be converted to YYYY-MM-DD format.
  5. Monetary values must be plain numbers (no currency symbols, no commas).
  6. If the document is a "Credit note", extract the raw numbers as they appear (including negative signs if printed).

  LAYOUT RULES FOR OXFORD NANOPORE:
  - ADDRESS BLOCKS: Look for two columns. Left is "Billing Address" (Buyer), Right is "Delivery Address" (Ship To).
    - "sold_to" is NOT present in these invoices; leave it as null.
  - TOTALS SECTION: Look for a right-aligned summary block.
    - Common labels: "Net amount", "Total discount", "Tax amount" OR "Sales tax amount", "Total charges", "Total amount GBP".
    - IMPORTANT DISTINCTION:
      - For Layout A (SI prefix): "Total charges" maps to "freight".
      - For Layout B (FI/FC prefixes): "Total charges" is an intermediate subtotal line. DO NOT map it to "freight". Only map "freight" if the label "CARRIAGE" is explicitly present.
    - CRITICAL MULTI-PAGE RULE: If this is Page 1 and the totals block (Net amount, VAT, Total) is NOT visible, set subtotal, vat_amount, and total to null. Do NOT attempt to calculate them. The final totals will be extracted from the final page.
    - CREDIT NOTE LAYOUT: If the document type is "Credit note", the summary block order is reversed. The "Total amount GBP" (negative) appears FIRST at the top of the block, followed by discount, charges, and net. You MUST extract the "Total amount GBP" value regardless of its position in the block.
  - DISCOUNTS: "Total discount" is often shown as 0.00. Extract it if present.
  - DELIVERY CHARGE: Look for the label "CARRIAGE". This maps to "freight".
  - SUBSCRIPTION PERIOD: Look for text like "(3 year)" or "3 year" in the description or header.
  - REFERENCES: Map observed labels to schema keys as follows:
    - "Purchase Order No." -> order_reference
    - "Sales Order No." -> order_confirmation
    - "Account No." -> your_reference
    - "VAT No." -> (Seller VAT if in header, or Buyer VAT if in buyer block)
    - "Invoice No." -> invoice_number
    - "Due date" -> (No schema field; ignore or store in notes if critical, but do not map to a specific schema key).
  - BANK DETAILS: Look for "IBAN", "SWIFT/BIC", "Sort Code", "Account Number".
  - FOOTER: Contains Company Registration No., DUNS number, Tax Registration No.
  - LINE ITEMS:
    - Layout A (SI prefix): Columns are `Package | Item No. | Description | QTY. | Unit Price | VAT Rate | Total Price`.
      - Map "Package" to "article".
    - Layout B (FI/FC prefixes): Columns are `Description | Quantity | Sales price | Tax Rates | Amount`.
      - Map "Sales price" to "unit_price".
      - Map "Amount" to "total_price".
    - Ignore "Commodity code" and "Net weight" in descriptions if they clutter the core product name, but keep the core description.
    - Include line items with zero total price (e.g., "UPS Shipping Bag").
    - NOTE: Unit prices may differ from (total_price / quantity) due to negotiated discounts. Extract values exactly as printed.
  - IGNORE: Large bold tracking numbers centered below line items (e.g., "DISP-23-14455-RB...") are NOT invoice numbers or line items. Ignore them.
  - CURRENCY: Usually GBP. Extract from the header or totals section.
  - DOCUMENT TYPE: Check header for "Invoice" or "Credit note".

  SCHEMA TO FILL:
  {
    "document_type": null,
    "invoice_number": null,
    "invoice_date": null,
    "currency": null,
    "seller": {
      "name": null,
      "address": null,
      "vat_number": null,
      "registration_number": null,
      "phone": null,
      "website": null
    },
    "buyer": {
      "name": null,
      "department": null,
      "address": null,
      "customer_number": null
    },
    "ship_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "sold_to": null,
    "references": {
      "your_reference": null,
      "order_reference": null,
      "order_date": null,
      "order_confirmation": null,
      "sales_person": null,
      "coordinator": null
    },
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

  REMEMBER: This is Page 1. If the totals block is missing, set subtotal, vat_amount, and total to null. The final totals will be extracted from the last page.

continuation_prompt: |
  You are an expert invoice extraction AI. You are processing Page 2+ of an invoice from Oxford Nanopore Technologies.

  INSTRUCTIONS:
  1. Extract additional line items and the final totals section.
  2.

    SUBSCRIPTION / SERVICE PERIOD (Oxford Nanopore — derive from item description):
    ONT invoices do NOT print explicit "from … to …" dates for service contracts. Instead the duration is embedded in the line-item description, e.g.:
      "GridION Standard Support (3 year)"     -> 3 years
      "PromethION Standard Support (1 year)"  -> 1 year
      "MinION Mk1C Standard Support (1 year)" -> 1 year
      "LICENSE AND WARRANTY 60 MONTHS - MK1B" -> 60 months
      "LICENSE AND WARRANTY 12 MONTHS"        -> 12 months
      "Annual subscription"                    -> 12 months
    When a line item description matches one of these patterns:
      - Set `subscription_period.start` = the invoice_date (YYYY-MM-DD).
      - Set `subscription_period.end`   = invoice_date plus the duration parsed from the description (round the day to the same day of month; if duration is in years multiply by 12 months).
    If multiple line items have different durations, use the LONGEST one.
    If no line item matches a duration pattern (typical for consumables-only orders), leave both fields null. Do not invent a period.
    Article codes that signal a support/warranty/subscription line: any code starting with "STANDARD", "PREMIUM", "SLW", or any description containing "Support", "WARRANTY", "License", "Subscription", "Maintenance".

  Return ONLY valid JSON. No markdown, no explanation.
  3. Use JSON null for any field not present on this page.
  4. Dates must be converted to YYYY-MM-DD format.
  5. Monetary values must be plain numbers.

  LAYOUT RULES FOR OXFORD NANOPORE (CONTINUATION):
  - LINE ITEMS: Append these to the list from Page 1. Ensure "position" numbers are sequential if possible, or use the printed position.
    - Handle both Layout A (SI prefix) and Layout B (FI/FC prefixes) as described in the extraction prompt.
  - TOTALS SECTION: This page usually contains the final summary. Look for "Net amount", "Total discount", "Tax amount" OR "Sales tax amount", "Total charges", "Total amount GBP".
    - IMPORTANT DISTINCTION:
      - For Layout A (SI prefix): "Total charges" maps to "freight".
      - For Layout B (FI/FC prefixes): "Total charges" is an intermediate subtotal line. DO NOT map it to "freight". Only map "freight" if the label "CARRIAGE" is explicitly present.
    - CREDIT NOTE LAYOUT: If the document type is "Credit note", the summary block order is reversed. The "Total amount GBP" (negative) appears FIRST at the top of the block. You MUST extract this value as "total".
    - CRITICAL: This is the final page. You MUST extract the "Net amount" (subtotal), "Tax amount" (vat_amount), and "Total amount GBP" (total). If these are present, they overwrite any partial values from Page 1.
  - DISCOUNTS: "Total discount" is often 0.00.
  - DELIVERY CHARGE: Look for "CARRIAGE".
  - BANK DETAILS: Full bank transfer instructions (IBAN, SWIFT) are often in the footer or a dedicated "Payment Details" section on this page.
  - NOTES: Look for "Payment reference instruction" or "Please provide Invoice No. as bank payment reference."

  SCHEMA TO FILL (ONLY FIELDS RELEVANT TO CONTINUATION):
  {
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

  ARITHMETIC CHECK (MANDATORY):
  Before outputting, verify: subtotal - discount_amount + freight + vat_amount ≈ total.
  If there is a discrepancy, adjust the extracted values to match the printed "Total amount GBP" exactly, prioritizing the printed total.
  Ensure discount_amount is always a positive number in the JSON.

  Return ONLY the JSON object.
