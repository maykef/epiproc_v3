# Manual tier overrides for invoices where the tier cannot be extracted from the PDF.
# These are typically continuation-page invoices whose cover page (with the tier header)
# is a separate document not included in the invoice directory.
#
# Format:
#   invoice_overrides:
#     <invoice_number>: <tier>   # applied to that specific invoice
#
#   contract_overrides:
#     <contract_number>: <tier>  # applied to ALL invoices sharing that contract number

invoice_overrides:
  "9001524602": "PremiumCare"   # T&C text references "Premium Care" contract
  # "903892511": ""             # Software subscription (Leica EDU Infinity) - exclude from timeline
  # "904150567": ""             # GPS subscription (SmartNet NRTK) - exclude from timeline

  # Fill in the rest based on physical invoices or Leica portal:
  # "9001578899": ""
  # "9001591985": ""
  # "9001514673": ""
  # "9001971771": ""
  # "9001584678": ""
  # "9001859422": ""
  # "9001864734": ""
  # "9001874193": ""
  # "9001773160": ""
  # "9001859409": ""

contract_overrides: {}
  # "43301433": "PremiumCare"   # same as 9001524602 — fills all invoices for this contract
