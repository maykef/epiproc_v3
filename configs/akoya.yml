supplier: akoya
dedup_key: invoice_number

dashboard:
  display_name: "Akoya Biosciences"
  color: "#005eb8"
  payer_fallback_keywords:
    - "Accounts Payable"
    - "Finance"
    - "Billing Department"
    - "Central Finance"
  negative_document_types:
    - "Credit Note"
    - "Credit Memo"
    - "Cancellation Invoice"
  # Canonical document_type values this supplier legitimately emits. Read by
  # the invoicing audit (D9). If absent, D9 is skipped for the supplier.
  document_types:
    - "Invoice"
    - "Credit Note"
    - "Cancellation Invoice"
    - "Credit Memo"

input_dir: invoices/akoya
output_dir: databases
db_filename: invoices_akoya.db

pdf_dpi: 100
max_tokens: 8192

extraction_prompt: |
  You are an invoice extraction engine.
  You are processing Page 1 of an invoice from "Akoya Biosciences".
  Return ONLY valid JSON. No markdown, no explanation.
  Use JSON null for any field not present on the page.
  All dates must be converted to YYYY-MM-DD.
  All monetary values must be plain numbers (no symbols, no commas).
  discount_amount must always be a positive number.

  CRITICAL CURRENCY RULE:
  - Akoya invoices often display dual currencies (GBP and USD).
  - YOU MUST EXTRACT ONLY GBP (£) VALUES.
  - IGNORE the USD column or USD amounts completely.
  - If a row shows "£6,202.80" and "$8,152.59", extract 6202.80.
  - If a row shows "USD Amt" and "Amount", extract from "Amount" (GBP).

  LAYOUT RULES FOR AKOYA:
  1. ADDRESS BLOCKS:
     - The header may have 2, 3, or 4 columns.
     - "Supplier" or "Akoya Biosciences" is usually top-left or left column.
     - "Shipped from" is usually top-center or right column.
     - "Bill To" is usually bottom-left or left column.
     - "Ship To" is usually bottom-center or right column.
     - If "Bill To" and "Ship To" are combined in one block, split them if distinct addresses exist; otherwise, map to both.
     - Look for labels: "Supplier", "Shipped from:", "Bill To", "Ship To", "Date of Supply of Goods".

  2. REFERENCE FIELDS:
     - Look for: "PO #", "Sales Rep", "Order #", "Tax Id", "Terms", "Incoterms", "Due Date".
     - Map "PO #" to order_reference.
     - Map "Order #" to order_confirmation.
     - Map "Sales Rep" to sales_person.
     - Map "Terms" to payment_terms.
     - Map "Tax Id" to seller.registration_number.
     - Ignore "Due Date" (do not map to any field) or map to payment_terms if no other terms exist.
     - Ignore "Incoterms" and "Date of Supply of Goods" (do not map to any field) or capture in notes if relevant.

  3. LINE ITEMS:
     - Extract position, article (product code), quantity, unit, description, unit_price, total_price.
     - Note: HTS codes may appear in the description or a separate column; do not extract HTS as a separate field, keep in description if needed.
     - CRITICAL: Do NOT include freight charge line items in the 'line_items' list.
       - If a line item description contains "Freight Charge" (e.g., "TBRFB Freight Charge", "FR2001 Freight Charge", "Freight Charge - PhenoCycler"), EXCLUDE it from the 'line_items' array.
       - Instead, extract the value of that line item and place it in the 'totals.freight' field.
     - CRITICAL — AKOYA ITEM ROW STRUCTURE:
       Each item spans TWO or THREE rows in the raw text:
           Row A: product code + description (e.g. "7000009 Conjugation Reagent Kit")
           Row B: description repeated (e.g. "Conjugation Reagent Kit")
           Row C: qty + HTS code + Rate (GBP) + USD Amt + Amount (GBP) (e.g. "1  3822.90.0000  £1,908.00  $2,580.93  £1,908.00")
       unit_price = Rate column value in Row C of THIS item only.
       total_price = Amount column value in Row C of THIS item only.
       NEVER use a price from a different item's Row C.
       Read items sequentially from top to bottom. Each new product code (e.g. 7000009, 5550003, FR2001) starts a new item.
     - CRITICAL: PhenoCycler Layout Handling (Two-row items):
       - Some items (especially PhenoCycler reagents) span two physical rows in the PDF (e.g., one row for code/HTS, next for description).
       - If you see duplicate descriptions or split rows that clearly belong to one product, MERGE them into a single line item.
       - For these merged items, ensure the 'total_price' reflects the sum of the values from both rows if they are split, or extract the 'Amount' column directly if available.
       - ALWAYS use the 'Amount' column (GBP) for total_price.
       - ALWAYS use the 'Rate' column for unit_price.
       - IGNORE the 'USD Amt' column completely.

  4. TOTALS & CURRENCY:
     - Prioritize the primary currency (GBP).
     - Look for: "Subtotal", "VAT 0%", "Total", "Amount Due", "USD Total Due".
     - VAT is often 0% (exempt) for exports (e.g., "NL Export supply").
     - If dual VAT rows are present (e.g., "VAT 0% (GBP)" and "VAT 0% (EUR)"), ALWAYS use the GBP row for vat_rate_percent and vat_amount.
     - If "VAT 0%" is shown, set vat_rate_percent to 0 and vat_amount to 0.
     - subtotal = sum of ALL line item total_prices (EXCLUDING any freight lines which are now in totals.freight).
     - total = the final "Total" or "Amount Due" amount (GBP).

  5. DOCUMENT TYPE:
     - Default to "invoice".
     - If "Credit Note" or similar is found, set document_type accordingly.

  ARITHMETIC CHECK (MANDATORY):
  Before outputting, verify: subtotal - discount_amount + freight + vat_amount ≈ total.
  If there is a discrepancy, adjust the extracted values to match the printed "Total" or "Amount Due" on the invoice, prioritizing the printed total.

  OUTPUT JSON TEMPLATE:
  {
    "document_type": null,
    "invoice_number": null,
    "invoice_date": null,
    "currency": null,
    "seller": {
      "name": null,
      "address": null,
      "vat_number": null,
      "registration_number": null,
      "phone": null,
      "website": null
    },
    "buyer": {
      "name": null,
      "department": null,
      "address": null,
      "customer_number": null
    },
    "ship_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "sold_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "references": {
      "your_reference": null,
      "order_reference": null,
      "order_date": null,
      "order_confirmation": null,
      "sales_person": null,
      "coordinator": null
    },
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

continuation_prompt: |
  You are processing Page 2+ of an Akoya Biosciences invoice.
  This page contains additional line items and the final summary totals.
  Return ONLY valid JSON. No markdown, no explanation.
  Use JSON null for any field not present on this page.

  CRITICAL CURRENCY RULE:
  - YOU MUST EXTRACT ONLY GBP (£) VALUES.
  - IGNORE the USD column or USD amounts completely.

  RULES FOR CONTINUATION PAGES:
  1. LINE ITEMS (CRITICAL — READ ALL OF THEM):
     - This page continues the item table from the previous page.
     - Extract EVERY SINGLE line item on this page. Do not stop early.
     - There may be 4–10 items on this page. Extract ALL of them.
     - Scan from the top of the page to the "Subtotal" or "Total" line. Every row with a product code, description, and GBP amount is a line item.
     - Do NOT include freight charge items ("FR2001 Freight Charge", "TBRFB Freight Charge", "Freight Charge"). Put those in totals.freight instead.
     - Each Akoya item spans TWO or THREE rows in the raw text:
         Row A: product code + description (e.g. "5450056 BX109—Alexa Fluor™ 750 for PhenoCycler")
         Row B: description repeated alone (e.g. "BX109—Alexa Fluor™ 750 for PhenoCycler")
         Row C: qty + HTS code + Rate (GBP) + USD Amt + Amount (GBP) (e.g. "1  3822.90.0000  £408.60  $552.49  £408.60")
     - unit_price = value from the Rate column in Row C of THAT item.
     - total_price = value from the Amount column in Row C of THAT item.
     - article = the product code from Row A (e.g. "BX109").
     - description = the clean description (e.g. "BX109—Alexa Fluor™ 750 for PhenoCycler").
     - NEVER carry a price from one item into the next item.

  2. TOTALS (CRITICAL):
     - The final totals (subtotal, VAT, total) are usually on the last page.
     - Overwrite any previous totals with the values found on this page.
     - Look for "Subtotal", "VAT 0%", "Total", "Amount Due".
     - If dual currency is present, ensure the 'total' field matches the final "Amount Due" or "Total" in GBP.
     - If dual VAT rows are present (e.g., "VAT 0% (GBP)" and "VAT 0% (EUR)"), ALWAYS use the GBP row for vat_rate_percent and vat_amount.
     - Recalculate subtotal as the sum of ALL line items (from page 1 and this page) BEFORE discounts (EXCLUDING freight lines).
     - Verify: subtotal - discount_amount + freight + vat_amount ≈ total.

  3. BANK DETAILS:
     - Akoya invoices often have detailed bank wire instructions on Page 2.
     - Look for: "Bank Name", "Sort Code", "Account Number", "IBAN", "SWIFT", "ACH", "Wire Instructions".
     - Extract these into the bank_details object.
     - Note: There may be separate instructions for GBP and USD/ACH. If multiple exist, prefer the one matching the invoice currency (GBP), or list the primary one.

  4. NOTES:
     - Extract any footer notes, remittance emails, confidentiality notices, or VAT exemption notes (e.g., "NL Export supply") into the 'notes' field.
     - Include "Incoterms" or "Date of Supply of Goods" in notes if not captured elsewhere.

  OUTPUT JSON TEMPLATE (ONLY FIELDS RELEVANT TO CONTINUATION):
  {
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }
