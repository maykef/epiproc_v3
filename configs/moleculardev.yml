supplier: moleculardev
dedup_key: invoice_number

dashboard:
  display_name: "Molecular Devices (UK) Limited"
  color: "#0055A4"
  payer_fallback_keywords:
    - "Finance"
    - "Accounts"
    - "Billing"
    - "Central"
  negative_document_types:
    - "credit note"
    - "credit memo"
    - "cancellation invoice"

input_dir: invoices/moleculardev
output_dir: databases
db_filename: invoices_moleculardev.db

pdf_dpi: 150
max_tokens: 4096

extraction_prompt: |
  You are an invoice extraction engine. You are processing Page 1 of an invoice from "Molecular Devices (UK) Limited".
  
  LAYOUT RULES:
  - The document usually has two address columns: "BILL TO:" (left) and "SHIP TO:" (right).
  - Look for reference fields: "MD Sales Order Number", "Purchase Order Number", "Customer Number", "Location Number", "Customer VAT Registration Number", "Shipment Date", "Ship Via", "Shipping Reference".
  - Line items may contain embedded Serial Numbers (e.g., "SNO: ...", "S/N ...", "IXM-C SNO: ...") and Work Order references (e.g., "WO-...") within the description.
  - The "TOTALS" section often appears as a table with columns: Tax Code, Currency, Tax Rate, Base Amount, Tax Amount.
  - "SHIPPING AND HANDLING" (article 9200-0016) is ALWAYS invoiced as an ordinary row inside the line-items table on Molecular Devices invoices. There is no separate "Freight" or "Shipping" row in the totals/summary area. The printed "Sub Total" equals the sum of all line items INCLUDING this shipping row.
  - Look for "Coverage dates" in the description for subscription periods.
  - Bank details may be listed at the bottom with multiple currencies (GBP, CHF, EUR). Extract the relevant bank details based on the invoice currency or list all if ambiguous.
  - Payment terms and Due Date are often in a separate box or row below the address blocks.
  
  EXTRACTION INSTRUCTIONS:
  1. Identify Document Type: Default to "invoice". Check for "Credit Note" or "Cancellation" labels.
  2. Extract Seller Info: Name is "Molecular Devices (UK) Limited". Extract VAT Number, Registration Number, Address, Phone, Website from the header.
  3. Extract Buyer Info: Map "BILL TO" to buyer. Map "SHIP TO" to ship_to. Extract Customer Number if present.
  4. Extract References: 
     - Map "MD Sales Order Number" to order_reference.
     - Map "Purchase Order Number" to your_reference.
     - Extract Sales Person, Order Date, Shipment Date, Ship Via, Shipping Reference.
     - Note: There is no "Coordinator" field on these invoices.
  5. Extract Line Items:
     - Position: Row number.
     - Article: Product code/SKU.
     - Description: Full text including any embedded Serial Numbers (SNO) or Work Orders (WO).
     - Quantity: Use the value from the "Invoice Quantity" column. Do not use "Order Quantity" or "Shipped Quantity".
     - Unit Price/Total Price: Extract as numbers.
  6. Extract Totals:
     - subtotal: Sum of ALL line item total_prices on this page (INCLUDING any SHIPPING AND HANDLING line). This must equal the printed "Sub Total".
     - discount: Check for "Discount" or "Restocking fee". If "Restocking fee" is a charge, add to handling_charges or discount_2 depending on context (usually a charge, so positive). If a discount is explicitly stated as a reduction, use discount_amount.
     - freight: ALWAYS set to null on this supplier. SHIPPING AND HANDLING (article 9200-0016) is a LINE ITEM, not freight — extract it as a normal entry in line_items[] with its article, description, quantity, unit_price, total_price. DO NOT map it to totals.freight. DO NOT remove it from line_items.
     - vat: Extract VAT Rate and VAT Amount from the tax table.
     - total: Grand total.
  7. Extract Bank Details: Look for sections labeled with currencies (GBP, CHF, EUR). Extract Bank Name, Sort Code, Account Number, IBAN, SWIFT.
  8. Extract Subscription Period: Look for "Coverage dates" in line item descriptions.
  
  UNIVERSAL RULES:
  - Return ONLY valid JSON. No markdown, no explanation.
  - Use JSON null for any field not present.
  - All dates → YYYY-MM-DD.
  - All monetary values → plain numbers (no symbols, no commas).
  - discount_amount → always a positive number.
  - subtotal = sum of ALL line item total_prices on this page.
  - total = grand total from the summary section.
  - Arithmetic check: subtotal - discount_amount + vat_amount ≈ total (freight is always null on this supplier; subtotal already includes any SHIPPING AND HANDLING line). Fix imbalances before outputting.

  OUTPUT TEMPLATE:
  {
    "document_type": null,
    "invoice_number": null,
    "invoice_date": null,
    "currency": null,
    "seller": {
      "name": null,
      "address": null,
      "vat_number": null,
      "registration_number": null,
      "phone": null,
      "website": null
    },
    "buyer": {
      "name": null,
      "department": null,
      "address": null,
      "customer_number": null
    },
    "ship_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "sold_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "references": {
      "your_reference": null,
      "order_reference": null,
      "order_date": null,
      "order_confirmation": null,
      "sales_person": null,
      "coordinator": null,
      "shipment_date": null,
      "ship_via": null,
      "shipping_reference": null
    },
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

continuation_prompt: |
  You are processing Page 2+ of an invoice from "Molecular Devices (UK) Limited".

  LAYOUT RULES:
  - Many Molecular Devices invoices use page 2 ONLY to repeat the header and show bank details — with NO new line items and NO totals summary visible on this page. In that case, return empty/null fields (see step 2 below).
  - When line items DO continue here, they appear in the same products table format as page 1.
  - "SHIPPING AND HANDLING" (article 9200-0016) is ALWAYS a line-item row in the products table, never a freight row in the totals.
  - Look for "Coverage dates" in descriptions for subscription periods.
  - Bank details and Payment Terms are often at the bottom of the final page.

  EXTRACTION INSTRUCTIONS:
  1. Extract additional Line Items:
     - If this page contains NO line-item rows, return line_items: [] (empty list, nothing to append).
     - Otherwise extract each row using the Invoice Quantity column. Include any SHIPPING AND HANDLING row as an ordinary line item.
  2. Extract Final Totals:
     - If this page contains NO totals/summary block (no "Sub Total", "VAT Amount", "Total" rows visible), return totals with ALL fields set to null. The merge step will keep the page-1 totals. Do NOT invent values from page 1.
     - If a totals summary IS visible on this page:
        - subtotal: SUM of ALL line items across ALL pages (including any SHIPPING AND HANDLING line). This must equal the printed "Sub Total".
        - discount_amount: If a discount is applied, extract it (always positive).
        - freight: ALWAYS null. SHIPPING AND HANDLING is a line item, not freight.
        - vat_amount: Extract final VAT.
        - total: Extract the final Grand Total.
  3. Extract Bank Details and Payment Terms if present on this page.

  UNIVERSAL RULES:
  - Return ONLY valid JSON. No markdown, no explanation.
  - Use JSON null for any field not present.
  - All dates → YYYY-MM-DD.
  - All monetary values → plain numbers.
  - discount_amount → always a positive number.
  - subtotal = sum of ALL line item total_prices across ALL pages (when a totals block is visible on this page).
  - total = grand total from the FINAL summary section (when visible on this page).
  - Arithmetic check (only when totals are extracted on this page): subtotal - discount_amount + vat_amount ≈ total (freight is always null on this supplier). Fix imbalances before outputting.
  
  OUTPUT TEMPLATE (Only fields relevant to continuation):
  {
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }
