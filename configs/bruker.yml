supplier: bruker
dedup_key: invoice_number
dashboard:
  display_name: Bruker
  color: '#0055A4'
  payer_fallback_keywords:
  - Central Finance
  - Accounts Payable
  - Finance Department
  - Billing Department
  negative_document_types:
  - Credit Note
  - Cancel Invoice
  - Cancellation invoice
  - SALES INVOICE
  document_types:
  - Invoice
  - Credit Note
  - Cancellation Invoice
  - Cancel Invoice
  - Dunning Letter
  c4_item_tolerance: 0.05
input_dir: invoices/bruker
output_dir: databases
db_filename: invoices_bruker.db
pdf_dpi: 150
max_tokens: 4096
pre_extraction_filter:
  reject_keywords:
  - PAST DUE PAYMENT
  - FINAL DEMAND
  - REQUEST FOR PAST DUE PAYMENT
  - 'ATTENTION: ACCOUNTS PAYABLE'
  - OVERDUE BALANCE
  reject_context:
  - Dear Customer
  - overdue balance
  - collection
  - immediate payment
  reject_action: non_invoice
extraction_prompt: |
  You are an invoice extraction engine. You are processing Page 1 of a multi-page document from "Bruker".
  Your goal is to extract structured data into a specific JSON format.

  CRITICAL RULES:
  1. Return ONLY valid JSON. No markdown, no explanation, no text before or after the JSON.
  2. Use JSON `null` for any field not present on this page.
  3. All dates must be converted to YYYY-MM-DD format.
  4. All monetary values must be plain numbers (no currency symbols, no commas).
  5. `discount_amount` must always be a positive number.
  6. `subtotal` is the sum of ALL line item `total_price` values across ALL pages. For Page 1, if the document is multi-page and the full summary is not visible, set `subtotal` to null. If the full summary is visible on Page 1, calculate the sum.
  7. `total` is the grand total from the FINAL summary section (usually on the last page). For Page 1, if a total is visible, extract it, but be aware it may be overwritten by Page 2+.
  8. Document Type Detection:
     - If the document contains "Credit Note", "Cancel Invoice", "Cancellation invoice", or "Cancel" in the header/title, set `document_type` to "credit note" or "cancellation invoice" respectively.
     - If "Proforma" is present, set to "proforma".
     - If the document contains "PAST DUE PAYMENT" or "FINAL DEMAND", set `document_type` to "dunning_letter" (and stop processing).
     - Otherwise, set to "invoice".

  LAYOUT INSTRUCTIONS FOR BRUKER:
  - Addresses: Look for two-column layouts. Left is usually "Bill-to Party" or "Bill To", Right is "Shipping Address" or "Ship To".
  - Seller: Look for "Bruker UK Limited", "BRUKER NANO GMBH", or "BRUKER". VAT number is often in the footer or header info block.
  - References: Look for "Order No.", "Purchase Order", "Delivery Note No.", "Customer No.", "Sales Order No.", "RMA No.", "Purchase Order Date".
  - Line Items: Look for tables with columns: Position, Article/Description, Quantity, Unit, Unit Price, Total Price.
    - Note: Descriptions may contain serial numbers, customs tariff numbers, country of origin, and batch numbers.
    - Note: Some items may have sub-items (e.g., "Labor hours" under a main item). Treat the main line as the primary item.
    - CRITICAL SUPPRESSION RULES (C3):
      - DO NOT extract rows where the description is exactly "Net" or matches the pattern "^Net$" (summary row).
      - DO NOT extract rows where the description is exactly "Freight" or "Shipping and handling costs" (summary row). These map to `totals.freight`, not `line_items`.
      - DO NOT extract rows containing "Prüfschärfe", "Delivery Specification", or "Batch Number:" as line items. These are compliance annotations.
      - DO NOT extract rows containing "Transferred to page N" or "Transferred from page N". These are carry-forward markers.
      - DO NOT extract any rows that appear ABOVE the main invoice header or the main column header row (e.g., "Item", "Description", "Qty", "Price"). Ignore "Transferred to page 2" summary blocks at the top of the page.
      - If a row has no item code/position and the description text clearly continues the previous line (e.g., starts with "FRU FOR..." or similar continuation), merge it with the previous item's description. Do not create a new line item.
      - If two consecutive lines have identical price and quantity, merge them into a single item (C3 Pattern D). Specifically, if the first line is a part code (e.g., "FRU-...") and the second is a description with the same price, treat them as one item.
  - Totals: Look for "Net", "Output Tax", "Gross", "Freight", "Total net".
    - VAT is often shown as "Output Tax" with a rate and amount.
    - Discounts may appear as "Invoice Discount" or as a negative line item with "PROMO CODE" or "DISCOUNT" in the description.
  - Bank Details: Often in the footer. Look for "GBP" and "EUR" accounts, IBAN, SWIFT, Sort Code.
  - Subscription Period: Look for "Settlement period", "Start Date", "End Date" in line item descriptions or reference blocks.
  - Multi-page handling: If the text says "Transferred to page 2" or "Continued on next page", note that totals on this page are incomplete.
  - Currency Inference (C1):
    - If no explicit currency is found on the page, check the Bill-to address. If the address is in the UK (contains "UK", "United Kingdom", or a UK postcode) and/or the VAT number starts with "GB", default `currency` to "GBP".
    - SPECIFIC RULE FOR SI+ INVOICES: If the `invoice_number` starts with "SI+", and the document contains a UK VAT number (e.g., "GB823847609"), infer `currency` as "GBP" even if no currency symbol is printed.

  EXTRACTION SCHEMA (Fill this JSON):
  {
    "document_type": null,
    "invoice_number": null,
    "invoice_date": null,
    "currency": null,
    "seller": {
      "name": null,
      "address": null,
      "vat_number": null,
      "registration_number": null,
      "phone": null,
      "website": null
    },
    "buyer": {
      "name": null,
      "department": null,
      "address": null,
      "customer_number": null
    },
    "ship_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "sold_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "references": {
      "your_reference": null,
      "order_reference": null,
      "order_date": null,
      "order_confirmation": null,
      "sales_person": null,
      "coordinator": null
    },
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

    CAPEX LINE-PRICE FALLBACK (Bruker capital equipment invoices):
    - On invoices for a single instrument (Capital Equipment — NMR, MRI, microscope, spectrometer, mass spectrometer) the line-items table sometimes prints ONLY the description and a separate price block, leaving the per-line price/amount columns blank in the standard line-item position.
    - Bruker totals block on these invoices uses the labels "Net" (value), "Output Tax" (VAT) and "Gross" (final). The "Net" row carries the GBP/EUR net amount for the whole document. There is NO separate "Net Value" or "Total Net" label — just "Net".
    - When a line item has a populated `description` but null unit_price AND null total_price, AND the invoice has exactly ONE commercial line of this kind, AND a row labelled "Net" (followed by a currency code and amount, e.g. "Net   GBP   1,499,548.87") is printed in the totals block:
        - MUTATE the existing article-coded row in place: set its `total_price` to that printed Net value (the figure on the "Net" row, which is excl. VAT).
        - If quantity is null, set quantity = 1. Set unit_price = total_price / quantity.
        - DO NOT emit an additional synthetic line item with a different description (e.g. text grabbed from header/footer like "Net", "Bruker UK Limited", "Recommended Option(s)…", or "A Factory Warranty Extension…"). Those text snippets are NOT line items — they are paragraphs of body text or header/footer noise.
        - The final `line_items[]` must have exactly ONE row for a single-capex invoice, with the original article code (e.g. BAP47/40, AV4600) preserved.
    - The Bruker "Net" amount may use European decimal formatting (e.g. "1.499.548,87" means 1,499,548.87) or UK formatting ("43,570.69"). Parse accordingly.
    - This rule applies only when the single capex line is the dominant or sole line item. Do NOT apply it when there are multiple line items.
    - Some capex invoices subtract an "ALREADY ISSUED DOWNPAYMENT INVOICE" beneath Gross to produce a "Remaining amount". When this happens, line_item total_price still equals the "Net" row value (NOT the Remaining amount). The "Net" row remains the correct source for the line item. ALSO: capture the downpayment amount (the figure after "ALREADY ISSUED DOWNPAYMENT INVOICE") into `totals.discount_2` so that `subtotal − discount_2 + vat_amount ≈ total_amount` balances (since total_amount = Remaining amount = Gross − Downpayment).
    - Affected historical invoices include 96430135 (£1.59M MRI, downpayment £166,617), 96473697 (£166k), 96573041, 96324283 (downpayment £15,685), 96557089 (downpayment £15,685).
continuation_prompt: |
  You are an invoice extraction engine. You are processing Page 2+ of a multi-page document from "Bruker".
  Your goal is to extract additional line items and the final totals.

  CRITICAL RULES:
  1. Return ONLY valid JSON. No markdown, no explanation.
  2. Use JSON `null` for any field not present on this page.
  3. All dates must be converted to YYYY-MM-DD format.
  4. All monetary values must be plain numbers.
  5. `discount_amount` must always be a positive number.
  6. `subtotal` must be the sum of ALL line item `total_price` values across ALL pages. If you see a subtotal on this page, verify it matches the sum of all items seen so far. If not, recalculate based on the line items.
  7. `total` is the grand total from the FINAL summary section on this page. This value will overwrite any total found on previous pages.
  8. Arithmetic Check: Ensure `subtotal - discount_amount + freight + vat_amount` is approximately equal to `total` (within 1 currency unit). If not, adjust the `total` to match the calculated sum or vice versa based on the explicit "Gross" or "Total" label on the page.

  LAYOUT INSTRUCTIONS FOR BRUKER (Continuation):
  - Line Items: Look for tables continuing from the previous page. Look for "Transferred from page X".
    - CRITICAL SUPPRESSION RULES (C3):
      - DO NOT extract rows where the description is exactly "Net" or matches the pattern "^Net$" (summary row).
      - DO NOT extract rows where the description is exactly "Freight" or "Shipping and handling costs" (summary row).
      - DO NOT extract rows containing "Prüfschärfe", "Delivery Specification", or "Batch Number:" as line items.
      - DO NOT extract rows containing "Transferred to page N" or "Transferred from page N".
      - If a row has no item code/position and the description text clearly continues the previous line, merge it with the previous item's description.
      - If two consecutive lines have identical price and quantity, merge them into a single item.
  - Totals: This page usually contains the final "Net", "Output Tax", "Gross", "Freight", and "Total" sections.
  - Bank Details: Often found in the footer of the last page.
  - Notes/Legal: Look for "EU embargo compliance", "Export Control", "Terms and Conditions", "Force Majeure". These should be captured in `notes`.
  - Discounts: If a discount is applied on this page, capture it.
  - C4 Exception: If a line item has a significant discount but the invoice has a global `discount` field populated, do not flag as an error; treat as contract pricing.

  EXTRACTION SCHEMA (Fill this JSON - only fields relevant to continuation):
  {
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

    CAPEX LINE-PRICE FALLBACK (Bruker capital equipment invoices):
    - On invoices for a single instrument (Capital Equipment — NMR, MRI, microscope, spectrometer, mass spectrometer) the line-items table sometimes prints ONLY the description and a separate price block, leaving the per-line price/amount columns blank in the standard line-item position.
    - Bruker totals block on these invoices uses the labels "Net" (value), "Output Tax" (VAT) and "Gross" (final). The "Net" row carries the GBP/EUR net amount for the whole document. There is NO separate "Net Value" or "Total Net" label — just "Net".
    - When a line item has a populated `description` but null unit_price AND null total_price, AND the invoice has exactly ONE commercial line of this kind, AND a row labelled "Net" (followed by a currency code and amount) is printed in the totals block:
        - Set the single line item's `total_price` to that printed Net value (the figure on the "Net" row, which is excl. VAT).
        - If quantity is null, set quantity = 1.
        - Set unit_price = total_price / quantity.
    - The Bruker "Net" amount may use European decimal formatting (e.g. "1.499.548,87" means 1,499,548.87) or UK formatting ("43,570.69"). Parse accordingly.
    - This rule applies only when the single capex line is the dominant or sole line item. Do NOT apply it when there are multiple line items.
    - Some capex invoices subtract an "ALREADY ISSUED DOWNPAYMENT INVOICE" beneath Gross to produce a "Remaining amount". When this happens, line_item total_price still equals the "Net" row value (NOT the Remaining amount). The "Net" row remains the correct source for the line item.
    - Affected historical invoices include 96430135 (£1.59M MRI), 96473697 (£166k), 96573041, 96324283, 96557089.
validation_rules:
  dedup_line_items:
    enabled: true
    match_fields:
    - article
    - quantity
    - unit
    - total_price
    action: merge
    merge_strategy: sum_quantities
    fuzzy_match:
      enabled: true
      threshold: 0.9
      ignore_case: true
      ignore_whitespace: true
    price_tolerance: 0.01
  relax_total_validation:
    enabled: true
    conditions:
    - document_type == 'invoice'
    - line_items_count > 0
    - totals.subtotal is null
    action: skip_arithmetic_check
