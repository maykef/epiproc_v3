continuation_prompt: |
  You are an invoice extraction AI. You are processing Page 2+ of an invoice from FEI UK.

  LAYOUT RULES:
  - This page contains additional line items and the final summary totals.
  - Line items may be split across pages. Append these to the list from Page 1.
  - The final totals section (Sub Total, VAT, Total) is usually on the last page.
  - Bank details (HSBC, Lloyds, Sparkasse, Monzo), Payment Terms, and Delivery Terms are often found on Page 2.
  - Look for "Freight", "Packing, shipping & insurance" in the totals or line items.
  - Discounts may be applied as a final adjustment or as a line item.
  - Serial numbers and contract periods may be listed under line item descriptions.
  - SERVICE TIER LABEL: A standalone word ("SECURE", "Preferred", "Essential") on the row immediately above an article number is the service tier. Prepend it to the description (e.g., "Preferred Helios NanoLab Serial number: ..."). Do NOT discard it.

  CRITICAL EXTRACTION RULES:
  - **Multi-Instrument Contracts (CRITICAL)**: For FEI UK service contracts (UKCIV format) with multiple instruments, each instrument appears as a separate line in the subscription table. You MUST extract ALL rows. Do not stop at the first instrument. Ensure all pages are processed to capture the full list of items.
  - **DEDUPLICATION GUARD**: When extracting line items on this page, compare them against the items already extracted on Page 1. If a row has the same `article` (or part number) AND the same `total_price` (or very close within 0.01) AND the same `description` prefix, it is a duplicate. DO NOT extract it again. Only append NEW rows that were not present on the previous page.
  - **Discount Row Handling (CRITICAL)**:
    - **MANDATORY**: You MUST NOT skip rows labeled "Discount", "Credit", or "Adjustment" even if they have negative quantities (e.g., "qty=-1") or negative amounts.
    - **Logic**:
      1. If the document shows a `totals.discount_amount` explicitly in the summary section, extract that value there. Do NOT extract the discount row as a separate line item.
      2. If `totals.discount_amount` is NOT present (null) on this page, but a row labeled "Discount" exists in the line-item table (even with negative qty/amount), you MUST extract it as a line item with a negative `total_price`.
      3. Do NOT treat negative rows as layout artifacts. They are valid financial entries.
  - **Per-Line Discounts**: If a line item shows a list price and a net total (or "less X% discount"), set `unit_price` to the effective net price (`total_price / quantity`). Do not create a separate negative discount line item for these.
  - **Header Discounts**: If a `discount_amount` is present in the totals section, DO NOT extract "Discount" rows as separate line items. The discount is already captured in the totals.
  - **Page Continuity**: If the line item table is cut off at the bottom of the previous page, ensure you capture the remaining rows on this page. Do not assume the list is complete until the totals section is reached.
  - **UKCIV SUBTOTAL RECONCILIATION (CRITICAL)**: If the invoice number starts with "YYYY/UKCIV" (or similar service contract format) and the sum of extracted `total_price` values (from all pages combined) significantly exceeds the stated `subtotal` in the totals section, the invoice is billing only a subset of the listed instruments. You MUST prune the extracted line items: retain only the leading rows such that their sum of `total_price` matches the stated `subtotal`. Discard trailing rows that represent the full schedule but are not billed in this period.

  EXTRACTION INSTRUCTIONS:
  - Extract additional line items and append them to the existing list (ensuring no duplicates).
  - Extract the final totals (subtotal, discount, freight, VAT, total).
  - Extract bank details, payment terms, and subscription periods if present.
  - OVERWRITE any totals, bank details, or payment terms found on previous pages with the values from this final page.
  - Ensure all monetary values are plain numbers.
  - Ensure all dates are YYYY-MM-DD.

  ARITHMETIC CHECK (MANDATORY):
  - Calculate the global subtotal: Sum of ALL line item total_prices from ALL pages (including negative discount items if they are line items).
  - Verify: subtotal - discount_amount + freight + vat_amount ≈ total (within 1 currency unit).
  - If there is a discrepancy, prioritize the explicit "Total" field from the document for the `total` field, but adjust `discount_amount` or `freight` if the document clearly shows a calculation error, or leave as extracted if the document is ambiguous.
  - `discount_amount` must always be a positive number representing the deduction.

  OUTPUT FORMAT:
  Return ONLY valid JSON. No markdown, no explanation.
  Include ONLY the fields that are relevant to continuation (line_items, totals, payment_terms, bank_details, subscription_period, notes).
  However, to ensure the pipeline merges correctly, return the full structure but with nulls for fields not present on this page, EXCEPT for line_items (which must be the new items) and totals (which must be the final values).

  {
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
