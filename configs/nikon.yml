supplier: nikon
dedup_key: invoice_number

dashboard:
  display_name: "Nikon Europe"
  color: "#EAB308"
  payer_fallback_keywords:
    - "UNIVERSITY OF CAMBRIDGE"
    - "SHARED SERVICE"
    - "MEDICINE"
    - "PHYSIOLOGY"
    - "DEPARTMENT OF"
  negative_document_types:
    - "Credit note"
    - "Cancellation invoice"
  # Debit Notes are positive documents on Nikon (additional billing for
  # under-invoiced amounts) — verified against case336911.pdf and case79548.pdf
  # where Total amount is printed positive. Do NOT add Debit Note here.
  # Canonical document_type values this supplier legitimately emits. Read by
  # the invoicing audit (D9). If absent, D9 is skipped for the supplier.
  document_types:
    - "Invoice"
    - "Credit note"
    - "Debit Note"
    - "Cancellation invoice"
    - "sales - invoice"
  # FIX C1: Allow zero-value invoices for Nikon as they are legitimate delivery notes/contracts
  zero_value_allowed: true

input_dir: invoices/nikon
output_dir: databases
db_filename: invoices_nikon.db

pdf_dpi: 100
max_tokens: 4096

extraction_prompt: |
  You are an invoice extraction engine. You are processing Page 1 of a multi-page document from Nikon (Nikon Europe B.V., Nikon Metrology Europe NV, or Nikon UK).
  
  LAYOUT RULES:
  - LAYOUT VARIATION 1 (Nikon Europe B.V.): Two-column layout. Left side contains "Bill To",
    "Ship To", or "Invoice Mailing address" blocks. Right side contains an "Invoice Details",
    "Credit Note Details", or "Debit Note details" box.
    - Invoice number label: "Number / Date" — the field value contains BOTH number and date
      in the format "940354364 / 11.09.2025". CRITICAL: split this field — take the numeric
      part before " / " as invoice_number, and the date after " / " as invoice_date.
    - Date format: DD.MM.YYYY. Convert to YYYY-MM-DD.
    - Line item columns: Item | Material [Description] | Qty | Net value (Currency GBP header).
      Map "Item" → position. Map "Material" (the material/product code) → article.
      Map the description text → description. Map "Qty" → quantity.
      There is NO separate "unit" or "unit_price" column on most Nikon Europe B.V. invoices.
      Set unit_price = null and unit = null unless a "Unit price" column is explicitly present.
      Map "Net value" → total_price.
    - Reference field mappings for Nikon Europe B.V.:
        "Your Order Number / Date"     → split: order_reference + order_date
        "Delivery note no. / Date"     → delivery_note_number (date part can be discarded)
        "Our Order number / Date"      → our_order_number (date part can be discarded)
        "Your customer number"         → buyer.customer_number
        "Your contract number"         → references.contract_number
        "Validity period"              → references.validity_period
    - Seller: use "Nikon Europe B.V." as seller.name. If a UK branch address appears, record
      it as part of seller.address but keep seller.name as "Nikon Europe B.V.".

  - LAYOUT VARIATION 2 (Nikon Metrology Europe NV): Two-column layout. LEFT side contains
    invoice metadata. RIGHT side contains the customer address ("Bill To").
    - Invoice number label: "Invoice No." (NOT "Number / Date").
    - Date format: DD/MM/YY (e.g. 15/09/25). Convert to YYYY-MM-DD.
    - Reference fields specific to Metrology:
        "Order No."       → references.order_reference
        "Our Vendor N°"   → references.our_vendor_number
        "Your Reference"  → references.your_reference
        "Document Date"   → invoice_date (if "Invoice No." date is absent)
        "Due Date"        → references.due_date
        "Customer"        → buyer.customer_number (it is a customer code, not a name)
    - Line item columns: No. | Description | Quantity | Unit Price | Disc. % | VAT Code | Amount
      CRITICAL LAYOUT HINT: In Nikon Metrology tables, the "Amount" (Total Price) column often
      appears BEFORE the "Unit Price" column, or the "Unit Price" column contains a reference
      value while the "Amount" column contains the billed total.
      - Map "No." → position.
      - Map "Description" → description.
      - Map "Quantity" → quantity.
      - Map "Amount" (the final column in the row, or the column labeled "Amount" regardless of position) → total_price.
      - Map "Unit Price" → unit_price ONLY if it is distinct from the "Amount" column.
      - If the sum of extracted line_item total_prices does NOT match the footer "Subtotal" or "Total amount",
        trust the footer value. If a line item total seems inflated (e.g., matches a unit price or reference number),
        set that specific line_item.total_price to null or 0.00 to align with the footer.
      - Extract Disc. % into line_items[].discount_percent.
    - "Our Vendor N°" and "Our Vendor N*" are the same field — both map to references.our_vendor_number.

  - Seller details (Nikon) are in the header or footer. Look for "Nikon Europe B.V.",
    "Nikon Metrology Europe NV", or "Nikon UK".
  - Buyer details: "Bill To", "Customer", "Invoice Mailing address", or Cambridge department names.
  - "Ship To" and "Sold To" may be separate blocks.
  - Line items may span multiple lines with detailed technical descriptions.
  - Totals section may appear on Page 1 (single-page), but usually on the final page.
  - Look for "Start date" and "End date" for subscription periods.
  - Bank details (Barclays, Fortis, BNP, KBC, Sort Code, Account Number, IBAN, SWIFT/BIC)
    may appear in the footer or on the right side.
  - Document types: "Invoice", "Credit note", "Debit Note", "Sales - Invoice",
    "Cancellation invoice", "Proforma".
  - Invoice numbers: 9–10 digits (Nikon Europe B.V.) or alphanumeric starting with "SINME" (Metrology).
  - Monetary values: Remove currency symbols and commas.
  - Discount (Nikon Europe B.V.): Look for a line labeled "adjustment" or "Adjustment" in the
    totals section or as a standalone negative line item. This is a discount — negate its value
    and place the positive result in totals.discount_amount. Do NOT create a line item for it.
    Also look for "Disc. %" percentage discount columns on individual line items.
    discount_amount must always be a positive number.
  - Tax numbers: "Our tax number" → seller.vat_number. "Your tax number" → notes (not buyer).
  - discount_2: use for a second document-level discount line if present (e.g. "Discount Agreed
    Price"). Leave null if only one discount exists.
  
  EXTRACTION SCHEMA:
  Extract the following fields. If a field is not found, use null.
  
  {
    "document_type": "invoice" | "credit note" | "cancellation invoice" | "proforma" | "debit note" | "sales - invoice",
    "invoice_number": null,
    "invoice_date": null,
    "currency": null,
    "seller": {
      "name": null,
      "address": null,
      "vat_number": null,
      "registration_number": null,
      "phone": null,
      "website": null
    },
    "buyer": {
      "name": null,
      "department": null,
      "address": null,
      "customer_number": null
    },
    "ship_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "sold_to": {
      "name": null,
      "department": null,
      "address": null
    },
    "references": {
      "your_reference": null,
      "order_reference": null,
      "order_date": null,
      "order_confirmation": null,
      "sales_person": null,
      "coordinator": null,
      "delivery_note_number": null,
      "our_order_number": null,
      "contract_number": null,
      "validity_period": null,
      "our_vendor_number": null,
      "due_date": null,
      "referenced_invoice_number": null,
      "referenced_invoice_date": null
    },
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null,
        "discount_percent": null,
        "vat_code": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

  RULES:
  - Return ONLY valid JSON. No markdown, no explanation.
  - Use JSON null for any field not present on the page.
  - All dates → YYYY-MM-DD.
  - All monetary values → plain numbers.
  - discount_amount → always a positive number.
  - subtotal = sum of ALL line item total_prices found on THIS page (for now).
  - total = null if not found on this page (will be overwritten by final page).
  - If "Credit note", "Debit Note", or "Sales - Invoice" is detected, set document_type accordingly.
  - For Credit/Debit notes, look for "Invoice number / Date" references and map them to 'referenced_invoice_number' and 'referenced_invoice_date'.
  - For bank details: If BIC is present, map it to the 'swift' field. If multiple bank accounts are listed (e.g., EUR and GBP), prioritize the one matching the invoice currency, or the first one listed if currency is ambiguous.
  - ZERO VALUE HANDLING: If the document shows Net Value 0.00 and Total 0.00, extract these as 0.0 (not null). This is valid for Nikon.

continuation_prompt: |
  You are an invoice extraction engine. You are processing Page N (N > 1) of a multi-page document from Nikon.
  
  CONTEXT:
  - Previous pages have been processed. Line items from previous pages are already known.
  - This page may contain:
    1. Continuation of line items (append to the list).
    2. Final totals section (Net Value, Output Tax, Total amount, Items total, Subtotal, Total Tax).
    3. Final payment terms, bank details, or notes.
  
  LAYOUT RULES:
  - Line items may continue from the previous page. Ensure position numbers are sequential.
  - Totals section is critical. Look for:
    - Standard: "Net Value", "Output Tax", "Total amount", "Subtotal", "VAT Amount".
    - Nikon Metrology specific: A table with columns "Code", "VAT Rate", and then either
      "Net Amount" | "VAT Amount" OR "Line Amount" | "VAT Base" | "VAT Amount" — map the
      net/line/base amount to subtotal and VAT Amount to vat_amount. Followed by summary
      rows "Subtotal", "Total Tax", "Total".
    - Credit Note specific: "Items total".
  - Bank details may be repeated on this page.
  - Payment terms may be specified here (e.g., "Up to 01.05.2026 without deduction").
  - Subscription periods (Start/End date) may be found here.
  
  EXTRACTION SCHEMA:
  Extract the following fields. If a field is not found, use null.
  
  {
    "line_items": [
      {
        "position": null,
        "article": null,
        "quantity": null,
        "unit": null,
        "description": null,
        "unit_price": null,
        "total_price": null,
        "discount_percent": null,
        "vat_code": null
      }
    ],
    "totals": {
      "subtotal": null,
      "discount_rate_percent": null,
      "discount_amount": null,
      "discount_2": null,
      "handling_charges": null,
      "freight": null,
      "vat_rate_percent": null,
      "vat_amount": null,
      "total": null
    },
    "payment_terms": null,
    "subscription_period": {
      "start": null,
      "end": null
    },
    "bank_details": {
      "bank_name": null,
      "sort_code": null,
      "account_number": null,
      "iban": null,
      "swift": null
    },
    "notes": null
  }

  RULES:
  - Return ONLY valid JSON. No markdown, no explanation.
  - Use JSON null for any field not present on the page.
  - All dates → YYYY-MM-DD.
  - All monetary values → plain numbers.
  - discount_amount → always a positive number.
  - subtotal = sum of ALL line item total_prices across ALL pages (including previous pages).
    If you cannot see previous pages, calculate subtotal based on the line items you see here plus any context provided, but ideally, the system merges line items first.
    For this prompt, assume you are providing the final totals and any new line items.
    The final "subtotal" in the merged result must be the sum of ALL line items.
  - total = grand total from the FINAL summary section after VAT.
  - ARITHMETIC CHECK (MANDATORY):
    Calculate: subtotal - discount_amount + freight + vat_amount.
    Compare this result to the extracted 'total'.
    If they do not match (within 1 currency unit), prioritize the 'total' from the footer.
    If the mismatch is due to a specific line item total being incorrect (e.g., in Nikon Metrology layouts),
    adjust the specific line_item.total_price to null or 0.00 to make the sum match the footer total.
    Do not output JSON until this balance is achieved.
  - If "Credit note", "Debit Note", or "Sales - Invoice" is detected, ensure document_type is set correctly (though usually determined on page 1).
  - Overwrite any totals, payment_terms, bank_details, or subscription_period found on this page with the values from this page (as it is the final page).
  - For bank details: If BIC is present, map it to the 'swift' field. If multiple bank accounts are listed, prioritize the one matching the invoice currency.
