[project]
name = "epiproc"
version = "3.0.0"
description = "EpiProc v3 — self-sufficient procurement engine (engine-in-a-box)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jinja2>=3.1",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23",
    "pyotp>=2.9",
    "qrcode[pil]>=8",
    "openai>=1.30",
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "pillow>=10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov", "ruff", "httpx"]

[project.scripts]
epiproc = "cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
