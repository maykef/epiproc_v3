{% extends "admin/base.html" %}
{% block title %}Password set{% endblock %}
{% block content %}
<h1>Password set</h1>
<div class="card">
  <p style="color:var(--muted);margin-bottom:8px">
    {{ label }} — share this with the user now, it will not be shown again:
  </p>
  <div class="secret-box" role="status" aria-label="Generated password">{{ password }}</div>
  <a class="btn btn-ghost" href="/admin/users">Back to users</a>
</div>
{% endblock %}
